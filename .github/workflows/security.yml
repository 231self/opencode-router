name: security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Install gitleaks (free CLI; the action is license-gated for orgs)
        env:
          GITLEAKS_VERSION: v8.30.1
        run: |
          go install github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}
          bin="$(go env GOBIN)"; [ -n "$bin" ] || bin="$(go env GOPATH)/bin"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Secret scan (full history)
        run: gitleaks detect --source . --redact --no-banner --exit-code 1

      - name: Rust security advisories (router core)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: packages/router/core

      - name: Rust security advisories (compaction core)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: packages/compaction/core

      - name: Tree and tarball secrets, dependency guard
        run: node scripts/security-check.mjs
