name: release

# Publishing is triggered by publishing a GitHub Release. CI validates and
# STAGES the version over npm trusted publishing (OIDC) — no NPM_TOKEN, no
# access token. A maintainer then reviews and approves the staged version
# with 2FA (npm stage approve, or the Staged Packages tab on npmjs.com), so
# nothing reaches the registry without a human decision.
on:
  release:
    types: [published]

permissions:
  id-token: write # the OIDC handshake with npm
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace
        run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install binaryen
        run: sudo apt-get update && sudo apt-get install -y binaryen

      # Base image for the runner; npm itself is pinned below. No
      # `registry-url`: that makes setup-node write an `.npmrc` with an
      # `_authToken` placeholder, and npm then tries token auth instead of the
      # OIDC trusted-publishing exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Staged publishing needs npm >= 11.15 and the OIDC flow needs >= 11.5.1.
      # Pinned deliberately: bump it together with reading the npm changelog.
      - name: Pin npm
        run: npm install -g npm@12.2.3 && npm --version

      - name: Ensure trusted publishing cannot fall back to a token
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NODE_AUTH_TOKEN is set; npm would bypass OIDC" >&2
            exit 1
          fi
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ] && grep -q '_authToken' "$npmrc"; then
            echo "$npmrc contains an _authToken; OIDC would be bypassed" >&2
            exit 1
          fi
          echo "no npm token configured; OIDC will be used"

      - name: Verify the release matches the router package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'require("./packages/router/package.json").version')
          test "$TAG" = "v$version" || { echo "tag $TAG does not match packages/router version $version" >&2; exit 1; }
          grep -q "^## $version " packages/router/CHANGELOG.md || { echo "packages/router/CHANGELOG.md has no section for $version" >&2; exit 1; }

      - name: Full check gate
        run: bun run check

      - name: Stage unpublished packages for approval (OIDC, provenance attached)
        run: |
          set -euo pipefail
          # Dependency order: dependents reference shared in their manifests,
          # so shared must reach the registry first.
          for dir in packages/shared packages/compaction packages/router; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published; skipping"
              continue
            fi
            grep -q "^## $version " "$dir/CHANGELOG.md" || { echo "$dir/CHANGELOG.md has no section for $version" >&2; exit 1; }
            (cd "$dir" && npm stage publish --access public)
          done
