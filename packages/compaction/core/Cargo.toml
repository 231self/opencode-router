[package]
name = "omlx_compaction_core"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
description = "Pure context-optimiser core for opencode-compaction"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
