[package]
name = "omlx_router_core"
version = "0.3.3"
edition = "2021"
license = "Apache-2.0"
description = "Pure routing and context-optimiser core for opencode-omlx-router"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
